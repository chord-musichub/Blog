baseURL = '/'
languageCode = 'zh-CN'
title = 'Songline Blog'
summaryLength = 120
hasCJKLanguage = true
enableRobotsTXT = true
# Hugo 只读取构建前筛选出的公开快照。运行时数据（账号、留言、Markdown 下载源等）
# 保留在 DATA_DIR，不能再被 Hugo 当作 data namespace 解析或发布。
dataDir = '.hugo-data'

[outputs]
home = ['HTML', 'RSS']

[pagination]
pagerSize = 10

[taxonomies]
tag = 'tags'
friend = 'friends'

[markup]
  [markup.highlight]
    noClasses = false
    style = 'github-dark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = true

[params]
description = '记录学习、创作与生活的个人博客。'
