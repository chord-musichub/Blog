{{- $scene := partial "scene-resources.html" . -}}
<script id="songline-scene-resources" type="application/json">{{ $scene | jsonify | safeJS }}</script>
<style id="songline-scene-entry-style">
html.is-scene-preparing::before{content:'';position:fixed;inset:0;z-index:2147482998;background:#020304;pointer-events:auto}
html.is-scene-preparing:not(.document-cover)::after{content:'';position:fixed;left:calc(50% - 15px);top:calc(50% - 15px);width:30px;height:30px;z-index:2147482999;border:1px solid rgba(237,243,255,.2);border-top-color:#edf3ff;border-radius:50%;animation:sceneEntrySpin 1s linear infinite;pointer-events:none}
html.is-boot-preparing.is-scene-preparing::after,html.is-booting.is-scene-preparing::after{display:none}
@keyframes sceneEntrySpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){html.is-scene-preparing::after{animation:none}}
</style>
<script>
(function(){
  var root=document.documentElement;
  var scene=JSON.parse(document.getElementById('songline-scene-resources').textContent);
  var urls=scene[scene.forceDark?'dark':root.getAttribute('data-theme')||'dark']||[];
  urls.forEach(function(url){var link=document.createElement('link');link.rel='preload';link.as='image';link.href=url;link.setAttribute('fetchpriority','high');link.dataset.scenePreload='1';document.head.appendChild(link);});
  if(!urls.length)return;
  root.classList.add('is-scene-preparing');
  root.setAttribute('aria-busy','true');
  // A missing/blocked initialization script must not leave the document covered.
  window.__songlineSceneEntryFallback=setTimeout(function(){root.classList.remove('is-scene-preparing');root.setAttribute('aria-busy','false');},18000);
})();
</script>
