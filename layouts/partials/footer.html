{{ $cfg := .Site.Data.site }}
<footer class="footer site-footer-clean">
  <div class="footer-inner">
    <span>© {{ now.Format "2006" }} {{ default "Blog" $cfg.site.display_name }}</span>
    <span class="footer-dot">·</span>
    <span>{{ default "由热爱驱动，持续记录" $cfg.site.footer_text }}</span>
    {{ with $cfg.site.icp }}
      {{ if and . (ne . "暂无") }}
        <span class="footer-dot">·</span>
        <a class="footer-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">ICP备案号：{{ . }}</a>
      {{ end }}
    {{ end }}
  </div>
</footer>
{{ $assetVersion := partial "asset-version.html" . }}
<script defer data-core-script="icon-system" src="/js/icon-system.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="theme-toggle" src="/js/theme-toggle.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="contact-copy" src="/js/contact-copy.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="views" src="/js/views.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="recommended-posts" src="/js/recommended-posts.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="markdown-code-tools" src="/js/markdown-code-tools.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="card-interactions" src="/js/card-interactions.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="lazy-backgrounds" src="/js/lazy-backgrounds.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="scroll-reveal" src="/js/scroll-reveal.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="desktop-fixed-nav" src="/js/desktop-fixed-nav.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="search-utils" src="/js/search-utils.js?v={{ $assetVersion }}"></script>
<script defer data-core-script="search" src="/js/search.js?v={{ $assetVersion }}"></script>
