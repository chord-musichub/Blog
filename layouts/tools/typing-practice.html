{{ define "main" }}

<main class="tool-page typing-page">
  <section class="typing-shell tool-detail-layout" data-typing-practice>
    <section class="typing-panel tool-detail-surface" data-tool-back-surface>
      {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
      <h1 class="tool-detail-title">打字练习</h1>
      {{ partial "tool-actionbar.html" "typing-practice" }}
      {{ partial "tool-help-dialog.html" "typing-practice" }}
      <div class="typing-topbar">
        <div class="typing-mode-group" role="group" aria-label="打字模式">
          <button class="typing-mode is-active" type="button" data-typing-mode="english">英文</button>
          <button class="typing-mode" type="button" data-typing-mode="mixed">中文/中英混打</button>
        </div>
      </div>

      <div class="typing-stats">
        <div class="typing-stat-card"><span>时间</span><strong data-typing-time>0.00s</strong></div>
        <div class="typing-stat-card"><span>进度</span><strong data-typing-progress>0%</strong></div>
        <div class="typing-stat-card"><span>错误</span><strong data-typing-errors>0</strong></div>
        <div class="typing-stat-card"><span>本地最佳</span><strong data-typing-best>--</strong></div>
      </div>

      <article class="typing-card">
        <div class="typing-meta"><span data-typing-article-title></span></div>
        <div class="typing-text" data-typing-text aria-label="练习文本"></div>
        <textarea class="typing-input" data-typing-input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入上方文字" aria-label="练习输入" autocorrect="off" inputmode="text"></textarea>
        <div class="typing-actions">
          <button class="typing-button" type="button" data-typing-focus>开始输入</button>
        </div>
      </article>

    </section>
      <details class="snake-leaderboard typing-leaderboard tool-detail-ranking" data-typing-leaderboard aria-label="打字练习前三名成绩">
        <summary>
          <span data-typing-rank-title>英文排行榜</span>
        </summary>
        <ol data-typing-top-scores>
          <li>暂无记录</li>
        </ol>
      </details>
  </section>
</main>
{{ end }}
