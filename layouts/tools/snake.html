{{ define "main" }}
<section class="tool-detail-layout tool-detail-layout--game" data-snake-game>
<section class="card snake-tool-panel tool-detail-surface" data-tool-back-surface>
  {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
  <h1 class="tool-detail-title" data-i18n-ui>贪吃蛇</h1>
  {{ partial "tool-actionbar.html" "snake" }}
  {{ partial "tool-help-dialog.html" "snake" }}
  <div class="snake-head">
    <div class="snake-stats" aria-live="polite">
      <span><span class="i18n-copy" data-i18n-ui>分数 </span><b data-snake-score>0</b></span>
      <span><span class="i18n-copy" data-i18n-ui>最高 </span><b data-snake-best>0</b></span>
      <span><span class="i18n-copy" data-i18n-ui>等级 </span><b data-snake-level>1</b></span>
      <span data-snake-state data-i18n-ui>准备开始</span>
    </div>
  </div>

  <div class="snake-stage-wrap">
    <canvas class="snake-canvas" width="480" height="480" data-snake-canvas aria-label="贪吃蛇游戏区域" data-i18n-attrs="aria-label"></canvas>
    <div class="snake-overlay" data-snake-overlay>
      <strong data-snake-overlay-title data-i18n-ui>点击开始</strong>
      <span data-snake-overlay-text hidden data-i18n-ui></span>
    </div>
  </div>
  <div class="snake-arcade-strip" aria-live="polite">
    <span class="snake-chip snake-combo" data-snake-combo data-i18n-ui>连击 x1</span>
    <span class="snake-chip snake-shield" data-snake-shield data-i18n-ui>护盾 0</span>
    <span class="snake-chip snake-slow" data-snake-slow data-i18n-ui>缓速 0s</span>
    <span class="snake-chip snake-rush" data-snake-rush data-i18n-ui>临时豆 待机</span>
  </div>
  <div class="snake-mobile-panel" data-snake-mobile-pad aria-label="移动端操作区" data-i18n-attrs="aria-label">
<div class="snake-mobile-pad" aria-label="移动端方向控制" data-i18n-attrs="aria-label">
      <button type="button" data-snake-dir="up">{{ partial "ui-icon.html" "arrow-up" }}</button>
      <button type="button" data-snake-dir="left">{{ partial "ui-icon.html" "arrow-left" }}</button>
      <button type="button" data-snake-dir="down">{{ partial "ui-icon.html" "arrow-down" }}</button>
      <button type="button" data-snake-dir="right">{{ partial "ui-icon.html" "arrow-right" }}</button>
    </div>
  </div>

</section>
  <details class="snake-leaderboard tool-detail-ranking" data-snake-leaderboard aria-label="贪吃蛇前三名成绩" data-i18n-attrs="aria-label">
    <summary><span data-i18n-ui>排行榜</span></summary>
    <ol data-snake-top-scores><li data-i18n-ui>暂无记录</li></ol>
  </details>
</section>

{{ end }}
