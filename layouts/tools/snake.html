{{ define "main" }}
<section class="tool-detail-layout tool-detail-layout--game" data-snake-game>
<section class="card snake-tool-panel tool-detail-surface" data-tool-back-surface>
  {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
  <h1 class="tool-detail-title">贪吃蛇</h1>
  {{ partial "tool-actionbar.html" "snake" }}
  {{ partial "tool-help-dialog.html" "snake" }}
  <div class="snake-head">
    <div class="snake-stats" aria-live="polite">
      <span>分数 <b data-snake-score>0</b></span>
      <span>最高 <b data-snake-best>0</b></span>
      <span>等级 <b data-snake-level>1</b></span>
      <span data-snake-state>准备开始</span>
    </div>
  </div>

  <div class="snake-stage-wrap">
    <canvas class="snake-canvas" width="480" height="480" data-snake-canvas aria-label="贪吃蛇游戏区域"></canvas>
    <div class="snake-overlay" data-snake-overlay>
      <strong data-snake-overlay-title>点击开始</strong>
      <span data-snake-overlay-text hidden></span>
    </div>
  </div>
  <div class="snake-arcade-strip" aria-live="polite">
    <span class="snake-chip snake-combo" data-snake-combo>连击 x1</span>
    <span class="snake-chip snake-shield" data-snake-shield>护盾 0</span>
    <span class="snake-chip snake-slow" data-snake-slow>缓速 0s</span>
    <span class="snake-chip snake-rush" data-snake-rush>临时豆 待机</span>
  </div>
  <div class="snake-mobile-panel" data-snake-mobile-pad aria-label="移动端操作区">
<div class="snake-mobile-pad" aria-label="移动端方向控制">
      <button type="button" data-snake-dir="up">{{ partial "ui-icon.html" "arrow-up" }}</button>
      <button type="button" data-snake-dir="left">{{ partial "ui-icon.html" "arrow-left" }}</button>
      <button type="button" data-snake-dir="down">{{ partial "ui-icon.html" "arrow-down" }}</button>
      <button type="button" data-snake-dir="right">{{ partial "ui-icon.html" "arrow-right" }}</button>
    </div>
  </div>

</section>
  <details class="snake-leaderboard tool-detail-ranking" data-snake-leaderboard aria-label="贪吃蛇前三名成绩">
    <summary><span>排行榜</span></summary>
    <ol data-snake-top-scores><li>暂无记录</li></ol>
  </details>
</section>

{{ end }}
