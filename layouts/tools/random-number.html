{{ define "main" }}
{{ partial "back-icon.html" (dict "fallback" "/tools/") }}
<section class="card random-tool-panel" data-random-tool>
  <div class="random-form">
    <label>
      <span>最小值</span>
      <input type="number" data-random-min value="1" inputmode="numeric">
    </label>
    <label>
      <span>最大值</span>
      <input type="number" data-random-max value="100" inputmode="numeric">
    </label>
    <button class="btn random-generate-button" type="button" data-random-generate>生成随机数</button>
  </div>

  <div class="random-result-box" aria-live="polite">
    <strong data-random-result>?</strong>
    <p data-random-note aria-live="polite"></p>
  </div>
</section>

<script defer src="/js/tools/random-number.js?v={{ partial "asset-version.html" . }}"></script>
{{ end }}
