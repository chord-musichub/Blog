{{ define "main" }}

<main class="tool-page reaction-test-page">
  <section class="reaction-shell tool-detail-layout tool-detail-layout--game" data-reaction-test>
    <section class="reaction-panel tool-detail-surface" data-tool-back-surface>
      {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
      <h1 class="tool-detail-title">反应测试</h1>
      <div class="reaction-stats">
        <div class="reaction-stat-card">
          <span>本次</span>
          <strong data-reaction-current>-- ms</strong>
        </div>
        <div class="reaction-stat-card">
          <span>本地最佳</span>
          <strong data-reaction-best>-- ms</strong>
        </div>
        {{ partial "tool-sound-toggle.html" (dict "class" "reaction-sound-toggle" "attribute" "data-reaction-sound-toggle") }}
      </div>

      <button class="reaction-stage" type="button" data-reaction-stage aria-live="polite">
        <span class="reaction-stage-kicker" data-reaction-kicker>准备测试</span>
        <strong data-reaction-title>点击开始</strong>
        <em data-reaction-text>变色前不要点。变色后越快越好。</em>
      </button>

      <div class="reaction-actions">
        <button class="reaction-button" type="button" data-reaction-start>开始 / 再测一次</button>
        <button class="reaction-button leaderboard-sync-btn" type="button" data-reaction-sync-best>同步本地最佳</button>
      </div>

    </section>
      <details class="snake-leaderboard reaction-leaderboard tool-detail-ranking" data-reaction-leaderboard aria-label="反应测试前三名成绩">
        <summary>
          <span>排行榜</span>
        </summary>
        <ol data-reaction-top-scores>
          <li>暂无记录</li>
        </ol>
      </details>
  </section>
</main>
{{ end }}
