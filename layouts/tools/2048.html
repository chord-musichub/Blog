{{ define "main" }}

<main class="tool-page tool-2048-page">
  <section class="tool-2048-shell tool-detail-layout tool-detail-layout--game" data-game-2048>
    <div class="game-2048-panel tool-detail-surface" data-tool-back-surface>
      {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
      <h1 class="tool-detail-title">2048</h1>
      <div class="game-2048-topbar">
        <div class="game-2048-score-card">
          <span>分数</span>
          <strong data-2048-score>0</strong>
        </div>
        <div class="game-2048-score-card">
          <span>最高</span>
          <strong data-2048-best>0</strong>
        </div>
        {{ partial "tool-sound-toggle.html" (dict "class" "game-2048-sound-toggle" "attribute" "data-2048-sound-toggle") }}
        <button class="game-2048-sync" type="button" data-2048-sync-best>同步本地最佳</button>
        <button class="game-2048-new" type="button" data-2048-new>重新开始</button>
      </div>

      <div class="game-2048-board-wrap">
        <div class="game-2048-board" data-2048-board aria-label="2048 游戏棋盘"></div>
        <div class="game-2048-overlay" data-2048-overlay hidden>
          <strong data-2048-overlay-title>2048</strong>
          <span data-2048-overlay-text>合并数字，冲到 2048。</span>
          <button type="button" data-2048-overlay-new>再来一局</button>
        </div>
      </div>

      <div class="game-2048-controls" aria-label="移动控制">
        <button type="button" data-2048-move="up" aria-label="向上">↑</button>
        <div class="game-2048-control-row">
          <button type="button" data-2048-move="left" aria-label="向左">←</button>
          <button type="button" data-2048-move="down" aria-label="向下">↓</button>
          <button type="button" data-2048-move="right" aria-label="向右">→</button>
        </div>
      </div>


    </div>
      <details class="snake-leaderboard game-2048-leaderboard tool-detail-ranking" data-2048-leaderboard aria-label="2048 前三名成绩">
        <summary>
          <span>排行榜</span>
        </summary>
        <ol data-2048-top-scores>
          <li>暂无记录</li>
        </ol>
      </details>
  </section>
</main>
{{ end }}
