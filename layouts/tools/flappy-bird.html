{{ define "main" }}

<main class="tool-page flappy-page">
  <section class="flappy-shell tool-detail-layout" data-flappy-game>
    <section class="flappy-panel tool-detail-surface" data-tool-back-surface>
      {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
      <h1 class="tool-detail-title">管道鸟</h1>
      <div class="flappy-topbar">
        <div class="flappy-score-card">
          <span>分数</span>
          <strong data-flappy-score>0</strong>
        </div>
        <div class="flappy-score-card">
          <span>本地最佳</span>
          <strong data-flappy-best>0</strong>
        </div>
        {{ partial "tool-sound-toggle.html" (dict "class" "flappy-sound-toggle" "attribute" "data-flappy-sound-toggle") }}
        <button class="flappy-button leaderboard-sync-btn" type="button" data-flappy-sync-best>同步本地最佳</button>
        <button class="flappy-button" type="button" data-flappy-start>开始 / 重来</button>
      </div>

      <div class="flappy-board-wrap">
        <canvas class="flappy-canvas" data-flappy-canvas width="900" height="520" aria-label="管道鸟游戏画布"></canvas>
        <button class="flappy-overlay" type="button" data-flappy-overlay>
          <span data-flappy-state>准备起飞</span>
          <strong data-flappy-title>点击开始</strong>
          <em data-flappy-text>点击屏幕 / 按空格：向上飞一下。</em>
        </button>
      </div>

    </section>
      <details class="snake-leaderboard flappy-leaderboard tool-detail-ranking" data-flappy-leaderboard aria-label="管道鸟前三名成绩">
        <summary>
          <span>排行榜</span>
        </summary>
        <ol data-flappy-top-scores>
          <li>暂无记录</li>
        </ol>
      </details>
  </section>
</main>
{{ end }}
