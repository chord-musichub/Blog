{{template "admin-head" (dict "Title" "申请修改密码" "Data" . "Navigation" false)}}
<body class="auth-page{{with .Settings.Background.Image}} admin-has-site-bg{{end}}"{{with .Settings.Background.Image}} style="--admin-site-bg-image:url('{{.}}');--admin-site-bg-height:{{default "420px" $.Settings.Background.Height}};--admin-site-bg-blur:{{default "18px" $.Settings.Background.Blur}};--admin-site-bg-opacity:{{default "0.38" $.Settings.Background.Opacity}};"{{end}}>
{{with .Settings.Background.Image}}<div class="admin-site-bg-layer" aria-hidden="true"></div>{{end}}
<div class="auth-preferences"><button class="admin-theme-icon-button" data-admin-theme-toggle type="button" aria-label="切换深色模式" title="切换深色模式" data-i18n-attrs="aria-label title"><svg class="theme-icon moon-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M21 14.4A8.7 8.7 0 0 1 9.6 3a7.2 7.2 0 1 0 11.4 11.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button><button class="language-toggle" data-language-toggle type="button" aria-label="切换为英文">中</button></div>
<main class="wrap narrow auth-card-wrap">
  <nav class="nav"><a class="admin-back-icon" href="{{adminURL "/login"}}" data-admin-back aria-label="返回" title="返回" data-i18n-attrs="aria-label title"><svg class="ui-line-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="m15 5-7 7 7 7"/></svg></a></nav>
  <h1 data-i18n-ui>申请修改密码</h1>
  <p class="meta" data-i18n-ui>提交后，管理员会在后台处理。批准后管理员会给你一个临时密码，登录后需要立刻修改。</p>
  {{if .Flash}}<div class="flash" data-i18n-text>{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="error" data-i18n-text>{{.Error}}</div>{{end}}
  <form method="post" class="card form">
    <label><span class="i18n-copy" data-i18n-ui>用户名 </span><input name="username" autocomplete="username" required></label>
    <label><span class="i18n-copy" data-i18n-ui>说明，可选 </span><input name="note" maxlength="120" placeholder="比如：忘记密码了" data-i18n-attrs="placeholder"></label>
    <button><span class="btn-ico" aria-hidden="true"><svg class="ui-line-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span><span class="btn-text" data-i18n-ui>提交申请</span></button>
  </form>
</main>
</body>
</html>
