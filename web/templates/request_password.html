<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请修改密码</title>{{template "admin-favicon" .}}<script>
(function(){
  try{
    var theme = localStorage.getItem('gexian-admin-theme') || 'dark';
    document.documentElement.setAttribute('data-admin-theme', theme);
    document.documentElement.style.backgroundColor = theme === 'dark' ? '#0d1728' : '#fbfaf7';
  }catch(e){
    document.documentElement.setAttribute('data-admin-theme', 'dark');
    document.documentElement.style.backgroundColor = '#0d1728';
  }
})();
</script><link rel="stylesheet" href="/static/style.css?v=20.18.5"><script defer src="/static/admin-theme.js"></script><script defer src="/static/page-transition.js?v=20.18.5"></script>
<style>
:root{
  --admin-bg:{{default "#fbfaf7" .Theme.Background}};
  --admin-panel:color-mix(in srgb, {{default "#fffdfa" .Theme.Panel}} 86%, transparent);
  --admin-panel-strong:{{default "#fffdfa" .Theme.Panel}};
  --admin-text:{{default "#15345b" .Theme.Text}};
  --admin-muted:{{default "#64748b" .Theme.Muted}};
  --admin-accent:{{default "#0ea5e9" .Theme.Accent}};
  --admin-accent-2:{{default "#2563eb" .Theme.Accent2}};
  --admin-soft:color-mix(in srgb, {{default "#0ea5e9" .Theme.Accent}} 11%, {{default "#fbfaf7" .Theme.Background}});
  --admin-warm:color-mix(in srgb, #ffe7bd 36%, {{default "#fbfaf7" .Theme.Background}});
}
</style>
<style id="admin-dark-top-hardfix">
html[data-admin-theme="dark"],
html[data-admin-theme="dark"] body,
html[data-admin-theme="dark"] body::before,
html[data-admin-theme="dark"] body::after{
  background:#0d1728!important;
  background-image:none!important;
}
html[data-admin-theme="dark"] body{
  margin-top:0!important;
  border-top:0!important;
  box-shadow:none!important;
}
html[data-admin-theme="dark"] .admin-site-bg-layer{
  display:block!important;
  visibility:visible!important;
  opacity:var(--admin-site-bg-opacity, .38)!important;
  background-image:var(--admin-site-bg-image)!important;
  background-size:cover!important;
  background-position:center top!important;
}
html[data-admin-theme="dark"] .admin-client-nav{
  background:#101c30!important;
  background-image:none!important;
  border-color:rgba(125,211,252,.18)!important;
}
html[data-admin-theme="dark"] .admin-main-nav,
html[data-admin-theme="dark"] .admin-glass-nav,
html[data-admin-theme="dark"] main.wrap > nav.nav:first-child,
html[data-admin-theme="dark"] .wrap > nav.nav:first-child{
  display:none!important;
  height:0!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  overflow:hidden!important;
  background:transparent!important;
  box-shadow:none!important;
}
</style>
<script defer src="/static/space-ribbons.js?v=20.18.5"></script>
</head>
<body class="auth-page{{with .Settings.Background.Image}} admin-has-site-bg{{end}}"{{with .Settings.Background.Image}} style="--admin-site-bg-image:url('{{.}}');--admin-site-bg-height:{{default "420px" $.Settings.Background.Height}};--admin-site-bg-blur:{{default "18px" $.Settings.Background.Blur}};--admin-site-bg-opacity:{{default "0.38" $.Settings.Background.Opacity}};"{{end}}>
{{with .Settings.Background.Image}}<div class="admin-site-bg-layer" aria-hidden="true"></div>{{end}}
<button class="admin-theme-icon-button" data-admin-theme-toggle type="button" aria-label="切换深色模式" title="切换深色模式"><svg class="theme-icon moon-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M21 14.4A8.7 8.7 0 0 1 9.6 3a7.2 7.2 0 1 0 11.4 11.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button>
<main class="wrap narrow auth-card-wrap">
  <nav class="nav"><a class="btn small ghost admin-back-icon" href="{{adminURL "/login"}}" data-admin-back aria-label="返回" title="返回"><svg class="ui-line-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M15 5 8 12l7 7"/><path d="M8.5 12H21"/></svg></a></nav>
  <h1>申请修改密码</h1>
  <p class="meta">提交后，管理员会在后台处理。批准后管理员会给你一个临时密码，登录后需要立刻修改。</p>
  {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" class="card form">
    <label>用户名 <input name="username" autocomplete="username" required></label>
    <label>说明，可选 <input name="note" maxlength="120" placeholder="比如：忘记密码了"></label>
    <button><span class="btn-ico" aria-hidden="true"><svg class="ui-line-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span><span class="btn-text">提交申请</span></button>
  </form>
</main>
</body>
</html>
