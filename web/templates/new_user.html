<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加作者</title><script>
(function(){
  try{
    var theme = localStorage.getItem('gexian-admin-theme') || 'dark';
    document.documentElement.setAttribute('data-admin-theme', theme);
    document.documentElement.style.backgroundColor = theme === 'dark' ? '#0d1728' : '#fbfaf7';
  }catch(e){
    document.documentElement.setAttribute('data-admin-theme', 'dark');
    document.documentElement.style.backgroundColor = '#0d1728';
  }
})();
</script><link rel="stylesheet" href="/static/style.css?v=20.18.5"><script defer src="/static/admin-theme.js"></script><script defer src="/static/admin-nav.js?v=20.18.5"></script><script defer src="/static/admin-mobile.js?v=20.18.5"></script><script defer src="/static/page-transition.js?v=20.18.5"></script>
<style>
:root{
  --admin-bg:{{default "#fbfaf7" .Theme.Background}};
  --admin-panel:color-mix(in srgb, {{default "#fffdfa" .Theme.Panel}} 86%, transparent);
  --admin-panel-strong:{{default "#fffdfa" .Theme.Panel}};
  --admin-text:{{default "#15345b" .Theme.Text}};
  --admin-muted:{{default "#64748b" .Theme.Muted}};
  --admin-accent:{{default "#0ea5e9" .Theme.Accent}};
  --admin-accent-2:{{default "#2563eb" .Theme.Accent2}};
  --admin-soft:color-mix(in srgb, {{default "#0ea5e9" .Theme.Accent}} 11%, {{default "#fbfaf7" .Theme.Background}});
  --admin-warm:color-mix(in srgb, #ffe7bd 36%, {{default "#fbfaf7" .Theme.Background}});
}
</style>
<style id="admin-dark-top-hardfix">
html[data-admin-theme="dark"],
html[data-admin-theme="dark"] body,
html[data-admin-theme="dark"] body::before,
html[data-admin-theme="dark"] body::after{
  background:#0d1728!important;
  background-image:none!important;
}
html[data-admin-theme="dark"] body{
  margin-top:0!important;
  border-top:0!important;
  box-shadow:none!important;
}
html[data-admin-theme="dark"] .admin-site-bg-layer{
  display:block!important;
  visibility:visible!important;
  opacity:var(--admin-site-bg-opacity, .38)!important;
  background-image:var(--admin-site-bg-image)!important;
  background-size:cover!important;
  background-position:center top!important;
}
html[data-admin-theme="dark"] .admin-client-nav{
  background:#101c30!important;
  background-image:none!important;
  border-color:rgba(125,211,252,.18)!important;
}
html[data-admin-theme="dark"] .admin-main-nav,
html[data-admin-theme="dark"] .admin-glass-nav,
html[data-admin-theme="dark"] main.wrap > nav.nav:first-child,
html[data-admin-theme="dark"] .wrap > nav.nav:first-child{
  display:none!important;
  height:0!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  overflow:hidden!important;
  background:transparent!important;
  box-shadow:none!important;
}
</style>
<script defer src="/static/space-ribbons.js?v=20.18.5"></script>
</head>
<body{{with .Settings.Background.Image}} class="admin-has-site-bg" style="--admin-site-bg-image:url('{{.}}');--admin-site-bg-height:{{default "420px" $.Settings.Background.Height}};--admin-site-bg-blur:{{default "18px" $.Settings.Background.Blur}};--admin-site-bg-opacity:{{default "0.38" $.Settings.Background.Opacity}};"{{end}}>
{{with .Settings.Background.Image}}<div class="admin-site-bg-layer" aria-hidden="true"></div>{{end}}

<nav class="admin-client-nav" data-admin-client-nav>
  <a class="admin-client-brand admin-client-brand-simple" href="{{adminURL "/"}}">后台</a>
  <div class="admin-client-links">
    <a href="{{adminURL "/"}}" data-admin-route="dashboard">工作台</a>
    {{if eq .User.Role "admin"}}<a href="{{adminURL "/admin"}}" data-admin-route="review">审核</a>{{end}}
    <a href="{{adminURL "/articles/new"}}" data-admin-route="new">新建</a>
    <a href="{{adminURL "/articles/upload"}}" data-admin-route="upload">上传</a>
    <a href="{{adminURL "/admin/media"}}" data-admin-route="media">媒体库</a>
    {{if eq .User.Role "admin"}}<a href="{{adminURL "/admin/site"}}" data-admin-route="site">站点</a>{{end}}
    {{if eq .User.Role "admin"}}<a href="{{adminURL "/users/new"}}" data-admin-route="users">作者</a>{{end}}
    <a href="{{adminURL "/account"}}" data-admin-route="account">账号</a>
  </div>
  <div class="admin-client-actions">
    <a class="admin-client-home" href="{{publicURL}}" target="_blank" rel="noopener">回主页 ↗</a>
    <button class="admin-theme-icon-button admin-client-theme" data-admin-theme-toggle type="button" aria-label="切换深色模式" title="切换深色模式"><svg class="theme-icon moon-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 14.4A8.7 8.7 0 0 1 9.6 3a7.2 7.2 0 1 0 11.4 11.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a class="admin-client-logout" href="{{adminURL "/logout"}}">退出</a>
  </div>
</nav>

<main class="wrap narrow">
  <nav class="nav compact-nav">
    <a class="btn small ghost admin-back-icon" href="{{adminURL "/admin"}}" data-admin-back aria-label="返回" title="返回"><svg class="ui-line-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M15 5 8 12l7 7"/><path d="M8.5 12H21"/></svg></a>
    <span class="spacer"></span><button class="admin-theme-icon-button" data-admin-theme-toggle type="button" aria-label="切换深色模式" title="切换深色模式"><svg class="theme-icon moon-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M21 14.4A8.7 8.7 0 0 1 9.6 3a7.2 7.2 0 1 0 11.4 11.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button>
  </nav>
  <h1>添加作者</h1>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" class="card form">
    <label>用户名 <input name="username" required placeholder="friend01"><small>只能用字母、数字、下划线、短横线。</small></label>
    <label>显示名 <input name="display" placeholder="朋友的名字"></label>
    <label>角色 <select name="role"><option value="author">author 作者</option><option value="admin">admin 管理员</option></select><small>普通创作账号选 author；只有管理站点的人才选 admin。</small></label>
    <label>账号类型
      <select name="account_type">
        <option value="friend">朋友作者：会显示在朋友页</option>
        <option value="owner">站长 / 主账号：你的个人创作身份</option>
        <option value="system">系统账号 / 公告：用于通知、公告、更新日志</option>
      </select>
      <small>建议：admin 设置为“系统账号 / 公告”；你自己的账号管理为“站长 / 主账号”。</small>
    </label>
    <label>初始密码 <span class="password-field"><input id="new-user-password" name="password" type="password" required placeholder="至少 6 位"><button class="password-toggle" type="button" data-password-toggle="#new-user-password" aria-label="显示密码"></button></span></label>
    <button><span class="btn-ico" aria-hidden="true">+</span><span class="btn-text">创建用户</span></button>
  </form>
</main>
</body>
</html>
