{{ define "main" }}
<section class="tool-detail-layout">
<section class="card gacha-tool-panel tool-detail-surface" data-gacha-tool data-tool-back-surface>
  {{ partial "back-icon.html" (dict "fallback" "/tools/") }}
  <h1 class="tool-detail-title" data-i18n-ui>抽卡模拟器</h1>
  {{ partial "tool-actionbar.html" "gacha" }}
  {{ partial "tool-help-dialog.html" "gacha" }}
  <div class="gacha-workspace">
  <div class="gacha-setup">
  <div class="gacha-head">
    <div class="gacha-status">
      <span><span class="i18n-copy" data-i18n-ui>抽数 </span><b data-gacha-total>0</b></span>
    </div>
  </div>

  <div class="gacha-config-grid">
    <label>
      <span data-i18n-ui>抽卡机制</span>
      <select data-gacha-mode>
        <option value="starRailLike" data-i18n-ui>原神 / 星穹铁道角色池</option>
        <option value="wutheringLike" data-i18n-ui>鸣潮角色池</option>
        <option value="arknightsLike" data-i18n-ui>明日方舟标准寻访</option>
        <option value="blueArchiveLike" data-i18n-ui>蔚蓝档案招募</option>
      </select>
    </label>

    <label>
      <span data-i18n-ui>卡池类型</span>
      <select data-gacha-banner>
        <option value="featured" data-i18n-ui>限定 / UP 池（有 UP 判定）</option>
        <option value="standard" data-i18n-ui>常驻池（无 UP / 无大保底）</option>
      </select>
    </label>
  </div>

  <div class="gacha-pity-grid">
    <div class="gacha-pity-card">
      <span data-i18n-ui>最高稀有保底进度</span>
      <strong><b data-gacha-pity>0</b>/<b data-gacha-hard-pity>90</b></strong>
      <div class="gacha-bar"><i data-gacha-pity-bar></i></div>
    </div>
    <div class="gacha-pity-card">
      <span data-i18n-ui>UP 状态</span>
      <strong data-gacha-guarantee data-i18n-ui>小保底</strong>
    </div>
    <div class="gacha-pity-card">
      <span data-i18n-ui>井 / 兑换进度</span>
      <strong><b data-gacha-spark>0</b>/<b data-gacha-spark-target>—</b></strong>
      <div class="gacha-bar"><i data-gacha-spark-bar></i></div>
    </div>
  </div>

  <div class="gacha-actions">
    <button class="btn gacha-pull-button" type="button" data-gacha-pull-one data-i18n-ui>单抽</button>
    <button class="btn gacha-pull-button" type="button" data-gacha-pull-ten data-i18n-ui>十连</button>
  </div>
  </div>

  <div class="gacha-result-box" aria-live="polite">
    <div class="gacha-result-head">
      <h2 data-i18n-ui>抽卡结果</h2>
      <p data-gacha-summary data-i18n-ui></p>
    </div>
    <div class="gacha-results" data-gacha-results data-i18n-ui>
      <div class="gacha-empty">{{ partial "ui-icon.html" "grid" }}<span data-i18n-ui>点击单抽或十连</span></div>
    </div>
  </div>
  </div>
</section>
</section>

{{ end }}
