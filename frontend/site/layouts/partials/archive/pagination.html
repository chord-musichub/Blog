<nav class="content-archive__pagination" data-archive-pagination="{{ . }}" aria-label="{{ if eq . "projects" }}项目{{ else }}文章{{ end }}分页" hidden>
  <button type="button" data-archive-page-step="-1" aria-label="上一页" data-i18n-attrs="aria-label"><span aria-hidden="true">&lt;</span></button>
  <div class="content-archive__page-numbers" data-archive-page-numbers></div>
  <button type="button" data-archive-page-step="1" aria-label="下一页" data-i18n-attrs="aria-label"><span aria-hidden="true">&gt;</span></button>
</nav>
