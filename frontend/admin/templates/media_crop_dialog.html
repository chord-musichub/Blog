{{define "media-crop-dialog"}}
<dialog id="coverCropDialog" class="cover-crop-dialog" aria-labelledby="coverCropTitle">
  <form method="dialog" class="cover-crop-dialog__bar">
    <div><h2 id="coverCropTitle" data-i18n-ui>裁剪图片</h2><p data-i18n-ui>拖动画面调整取景；滚轮或滑杆缩放。原图不会被修改。</p></div>
    <button class="btn small ghost" value="cancel" aria-label="关闭裁剪器" data-i18n-attrs="aria-label" data-i18n-ui>关闭</button>
  </form>
  <div class="cover-crop-stage"><canvas id="coverCropCanvas" width="1600" height="900" aria-label="图片裁剪预览" data-i18n-attrs="aria-label"></canvas></div>
  <div class="cover-crop-dialog__controls">
    <label><span class="i18n-copy" data-i18n-ui>缩放 </span><input id="coverCropZoom" type="range" min="1" max="3" step="0.01" value="1"></label>
    <span id="coverCropSize">1600 × 900</span>
    <button id="coverCropSave" type="button" class="btn" data-i18n-ui>保存裁剪图片</button>
  </div>
</dialog>
{{end}}
