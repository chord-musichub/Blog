{{define "settings-sidebar"}}
{{if isOwnerUser .User}}
<aside class="settings-sidebar" aria-label="设置分类" data-i18n-attrs="aria-label">
  <a href="{{adminURL "/account"}}" {{if eq .SettingsSection "account"}}class="active"{{end}}>{{template "admin-icon" "user"}}<span class="i18n-copy" data-i18n-ui>账号资料</span></a>
  <a href="{{adminURL "/admin/site"}}" {{if eq .SettingsSection "site"}}class="active"{{end}}>{{template "admin-icon" "grid"}}<span class="i18n-copy" data-i18n-ui>站点信息</span></a>
  <a href="{{adminURL "/admin/theme"}}" {{if eq .SettingsSection "theme"}}class="active"{{end}}>{{template "admin-icon" "settings"}}<span class="i18n-copy" data-i18n-ui>外观主题</span></a>
  <a href="{{adminURL "/admin/manuscript"}}" {{if eq .SettingsSection "manuscript"}}class="active"{{end}}>{{template "admin-icon" "file"}}<span class="i18n-copy" data-i18n-ui>文章默认</span></a>
</aside>
{{end}}
{{end}}
